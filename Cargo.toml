[workspace]
resolver = "2"
members = [
    "apps/api",
    "apps/web",
    "crates/mock",
    "crates/client",
    "crates/session",
    "crates/ui",
    "crates/page-auth",
    "crates/page-overview",
    "crates/page-account",
    "crates/page-models",
    "crates/page-leaderboard",
    "crates/page-admin",
    "crates/page-users",
    "crates/contract",
    "crates/protocol",
    "crates/gateway/admission",
    "crates/gateway/dispatch",
    "crates/gateway/forward",
    "crates/gateway/metering",
    "crates/service/store",
    "crates/service/catalog",
    "crates/service/sync",
    "crates/service/billing",
    "crates/service/observe",
    "crates/service/ops",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
publish = false

[workspace.dependencies]
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "sync", "time", "io-util"] }
axum        = "0.8"
tower       = "0.5"
tower-http  = { version = "0.6", features = ["cors", "trace", "limit"] }
reqwest     = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.9"
sqlx        = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "macros", "json"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
thiserror   = "2"
bytes       = "1"
arc-swap    = "1"
chrono      = { version = "0.4", features = ["serde"] }
rand        = "0.8"
futures-util = "0.3"
tracing-appender = "0.2"
tracing-log = "0.2"
dioxus      = { version = "=0.7.9", features = ["router"] }
gloo-net   = { version = "0.6", features = ["json"] }
http        = "1"
uuid        = { version = "1", features = ["serde", "v7"] }

[profile.release]
lto           = "fat"
codegen-units = 1
strip         = true

[profile.dev.package."*"]
opt-level = 1
