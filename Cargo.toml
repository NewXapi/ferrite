[workspace]
resolver = "2"
members = [
    "apps/admin-web",
    "apps/api",
    "apps/gateway",
    "apps/tavern-web",
    "crates/gateway/dispatch",
    "crates/gateway/forward",
    "crates/gateway/gate",
    "crates/gateway/metering",
    "crates/gateway/pipeline",
    "crates/gateway/protocol-bridge",
    "crates/gateway/proxy",
    "crates/gateway/security",
    "crates/api/admin-billing",
    "crates/api/admin-catalog",
    "crates/api/admin-observe",
    "crates/api/admin-ops",
    "crates/api/admin-router",
    "crates/api/admin-store",
    "crates/api/admin-sync",
    "crates/api/auth",
    "crates/web/admin-client",
    "crates/web/admin-mock",
    "crates/web/admin-page-account",
    "crates/web/admin-page-admin",
    "crates/web/admin-page-auth",
    "crates/web/admin-page-overview",
    "crates/web/admin-page-users",
    "crates/web/admin-session",
    "crates/api/tavern-auth",
    "crates/api/tavern-characters",
    "crates/api/tavern-chats",
    "crates/api/tavern-generate",
    "crates/api/tavern-media",
    "crates/api/tavern-presets",
    "crates/api/tavern-secrets",
    "crates/api/tavern-settings",
    "crates/api/tavern-storage",
    "crates/web/tavern-client",
    "crates/web/tavern-page-characters",
    "crates/web/tavern-page-chat",
    "crates/web/tavern-page-home",
    "crates/web/tavern-page-lorebook",
    "crates/web/tavern-page-personas",
    "crates/web/tavern-page-settings",
    "crates/web/tavern-state",
    "crates/web/ui-components",
    "crates/harness/core",
    "crates/harness/prompt",
    "crates/harness/runtime",
    "crates/harness/tools",
    "crates/harness/ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
publish = false

[workspace.dependencies]
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "sync", "time", "io-util"] }
axum        = "0.8"
hyper       = { version = "1", features = ["client", "http2"] }
http        = "1"
tower       = "0.5"
tower-http  = { version = "0.6", features = ["cors", "trace", "limit"] }
reqwest     = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.9"
sqlx        = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "macros", "json"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
tracing-appender = "0.2"
tracing-log = "0.2"
thiserror   = "2"
dioxus      = { version = "=0.7.9", features = ["router"] }
gloo-net   = { version = "0.6", features = ["json"] }
sha2        = "0.10"
hex         = "0.4"
bytes       = "1"
arc-swap    = "1"
chrono      = { version = "0.4", features = ["serde"] }
rand        = "0.8"
futures-util = "0.3"
uuid        = { version = "1", features = ["serde", "v4", "v7"] }
