[workspace]
resolver = "2"
members = [
    "apps/api",
    "apps/admin-web",
    "crates/contract",
    "crates/gateway/protocol",
    "crates/gateway/dispatch",
    "crates/gateway/forward",
    "crates/gateway/metering",
    "crates/gateway/pipeline",
    "crates/gateway/gate",
    "crates/gateway/protocol-bridge",
    "crates/gateway/proxy",
    "crates/admin-api/store",
    "crates/admin-api/catalog",
    "crates/admin-api/sync",
    "crates/admin-api/billing",
    "crates/admin-api/observe",
    "crates/admin-api/ops",
    "crates/admin-api/auth",
    "crates/admin-api/router",
    "crates/admin-web/client",
    "crates/admin-web/session",
    "crates/admin-web/ui",
    "crates/admin-web/mock",
    "crates/admin-web/page-auth",
    "crates/admin-web/page-overview",
    "crates/admin-web/page-account",
    "crates/admin-web/page-admin",
    "crates/admin-web/page-users",
    "crates/tavern-api/storage",
    "crates/tavern-api/auth",
    "crates/tavern-api/characters",
    "crates/tavern-api/chats",
    "crates/tavern-api/settings",
    "crates/tavern-api/secrets",
    "crates/tavern-api/generate",
    "crates/tavern-api/media",
    "crates/tavern-web/client",
    "crates/tavern-web/state",
    "crates/tavern-web/ui",
    "crates/tavern-web/page-characters",
    "crates/tavern-web/page-chat",
    "crates/tavern-web/page-settings",
    "crates/harness/core",
    "crates/harness/prompt",
    "crates/harness/tools",
    "crates/harness/runtime",
    "crates/harness/ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
publish = false


[workspace.dependencies]
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "sync", "time", "io-util"] }
axum        = "0.8"
hyper       = { version = "1", features = ["client", "http2"] }
tower       = "0.5"
tower-http  = { version = "0.6", features = ["cors", "trace", "limit"] }
reqwest     = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.9"
sqlx        = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "macros", "json"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
thiserror   = "2"
bytes       = "1"
arc-swap    = "1"
chrono      = { version = "0.4", features = ["serde"] }
rand        = "0.8"
futures-util = "0.3"
tracing-appender = "0.2"
tracing-log = "0.2"
dioxus      = { version = "=0.7.9", features = ["router"] }
gloo-net   = { version = "0.6", features = ["json"] }
http        = "1"
uuid        = { version = "1", features = ["serde", "v4", "v7"] }

[profile.release]
lto           = "fat"
codegen-units = 1


[profile.dev.package."*"]
opt-level = 1
