[workspace]
resolver = "2"
members = [
    "apps/api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "sync", "time", "io-util"] }
axum        = "0.8"
tower       = "0.5"
tower-http  = { version = "0.6", features = ["cors", "trace", "limit"] }
reqwest     = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.9"
sqlx        = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "macros", "json"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror   = "2"
bytes       = "1"
arc-swap    = "1"
chrono      = { version = "0.4", features = ["serde"] }

[profile.release]
lto           = "fat"
codegen-units = 1
strip         = true

[profile.dev.package."*"]
opt-level = 1
