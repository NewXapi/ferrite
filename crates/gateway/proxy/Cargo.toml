[package]
name = "gateway-proxy"
version = "0.1.0"
edition = "2024"
publish = false

# 出口代理节点：解析 + 按 channel_key 选节点 + 租约 Client。
# HTTP/SOCKS 握手交给 reqwest；vless/vmess/ss/trojan 走 meow_proxy 适配器。

[dependencies]
reqwest        = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
arc-swap       = { workspace = true }
rand           = { workspace = true }
tokio          = { workspace = true, features = ["rt-multi-thread", "macros", "time", "io-util", "net"] }
async-trait    = "0.1"
memchr         = "2"
tracing        = { workspace = true }
url            = "2"
percent-encoding = "2"
uuid = "1"
meow-common = "0.21"

# 出口协议适配（meow-rs, MIT）：vless/vmess/ss/trojan/hysteria2/anytls/snell 等由 ProxyAdapter 提供
meow-proxy = { version = "0.21", default-features = false, features = ["ss", "trojan", "vless", "vless-vision", "vmess", "hysteria2", "anytls", "snell"] }
meow-transport = { version = "0.21", default-features = false, features = ["tls", "ws", "reality"] }
hex            = { workspace = true }
