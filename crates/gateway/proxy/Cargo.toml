[package]
name = "gateway-proxy"
version = "0.1.0"
edition = "2024"
publish = false

# 出口代理节点：解析 + 按 channel_key 选节点 + 租约 Client。
# HTTP/SOCKS 握手交给 reqwest；vless/vmess/ss/trojan 走 proto/（shoes 移植）。

[dependencies]
reqwest        = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
arc-swap       = { workspace = true }
rand           = { workspace = true }
tokio          = { workspace = true, features = ["rt-multi-thread", "macros", "time", "io-util", "net"] }
async-trait    = "0.1"
memchr         = "2"
url            = "2"
percent-encoding = "2"
