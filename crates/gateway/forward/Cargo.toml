[package]
name = "forward"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# 上游转发 — 协议适配 + 流式管道。转发是纯 IO, 不做业务判断。

[dependencies]
gateway-pipeline = { path = "../pipeline" }
dispatch = { path = "../dispatch" }
gateway-protocol-bridge = { path = "../protocol-bridge" }
gateway-proxy = { path = "../proxy" }
contract = { path = "../../contract" }
serde    = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"
anyhow = "1"
reqwest  = { workspace = true }
metering = { path = "../metering" }
tokio    = { workspace = true }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { workspace = true }
axum = { workspace = true }
bytes    = { workspace = true }
tracing  = { workspace = true }
chrono   = { workspace = true }
hyper = { version = "1", features = ["client", "http1"] }
http     = { workspace = true }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
webpki-roots = "0.26"

[dev-dependencies]
tokio = { workspace = true }
futures-util = { workspace = true }
parking_lot = "0.12"
http = { workspace = true }
uuid = { workspace = true }
