[package]
name = "admin-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# 出口代理节点管理域 — `[[proxy_nodes]]` 的 DB 化写侧（CRUD/校验/测速）。
# 协议装配与 URL 语义在 gateway-proxy；本 crate 只管存储与 API 面。

[dependencies]
axum     = { workspace = true }
sqlx     = { workspace = true }
serde    = { workspace = true }
serde_json = { workspace = true }
uuid     = { workspace = true }
chrono   = { workspace = true }
tracing  = { workspace = true }
thiserror = { workspace = true }
url      = "2"
auth     = { path = "../auth" }
gateway-proxy = { path = "../../gateway/proxy" }
# 订阅拉取/解析（clash YAML）委托 meow-config，本 crate 只做 map → 分享链接映射
meow-config = { version = "0.21", default-features = false, features = ["ss", "trojan", "vless", "vmess"] }
serde_yaml = "0.9"
# 分享链接 #备注 的 percent-decode（与 gateway-proxy 同款依赖）
percent-encoding = "2"

[dev-dependencies]
db-bootstrap = { path = "../db-bootstrap" }
tokio = { workspace = true }
catalog = { path = "../admin-catalog" }
