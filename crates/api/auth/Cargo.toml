[package]
name = "auth"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# 登录 / 注册 / refresh / logout / self — admin-api 控制面的人认证。
# 依赖 contract (DTO/记录) + store (复用错误形状)。
# 直连 sqlx::PgPool，不走 store trait（loose 表阶段）。

[dependencies]
contract     = { path = "../../contract" }
store        = { path = "../admin-store" }
axum         = { workspace = true }
tokio        = { workspace = true }
sqlx         = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
chrono       = { workspace = true }
uuid         = { workspace = true }
thiserror    = { workspace = true }
rand         = { workspace = true }
tracing      = { workspace = true }
sha2         = { workspace = true }
hex          = { workspace = true }
hmac         = "0.12"
argon2       = "0.5"
jsonwebtoken = "9"
