sqlx         = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
chrono       = { workspace = true }
uuid         = { workspace = true }
thiserror    = { workspace = true }
rand         = { workspace = true }
tracing      = { workspace = true }
sha2         = { workspace = true }
hex          = { workspace = true }
hmac         = "0.12"
argon2       = "0.5"
jsonwebtoken = "9"

[dev-dependencies]
db-bootstrap = { path = "../db-bootstrap" }
