page: "#aliases"
name: "别名管理"

# 契约源：crates/web/admin-page-admin/src/aliases.rs 的 AliasesPage，及
# crates/web/ui-components/src/components/admin_card/{card,dot_tab,aliases}.rs。
# 导航入口：管理区「别名」tab（Section::Manage index 3）或 #aliases hash。

elements:
  # ---------- 新卡示例 ----------
  - role: region
    name: "别名新卡示例"
    required: false
    testid: "alias-card-prototype"

  # 共享卡内的四颗圆点是普通按钮，切换只读内容（不采用 ARIA tab 语义）。
  - role: group
    name: "内容页签"
    required: false

  - role: button
    name: "概览 / 定价 / 分组 / 系统"
    required: false
    testid: "dot-tab-0..3"
    action: click
    effect: "切换只读内容"

  # 当前入口只转发既有编辑回调；Popover 尚未实现。
  - role: button
    name: "编辑入口（未来可接 Popover）"
    required: false
    testid: "admin-card-edit"
    action: click
    effect: "触发现有编辑入口（不是 Popover 已实现）"
