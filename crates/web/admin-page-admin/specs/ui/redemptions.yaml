page: "#redemptions"
name: "兑换码管理"

# 契约源：crates/web/admin-page-admin/src/redemptions.rs 的 RedemptionsPage，及
# crates/web/ui-components/src/components/admin_card/{card,dot_tab,redemptions}.rs。
# 导航入口：管理区「兑换」tab（Section::Manage index 6）或 #redemptions hash。

elements:
  # ---------- 新卡示例 ----------
  - role: region
    name: "新卡示例"
    required: false
    testid: "redemption-card-prototype"

  # 共享卡内的四颗圆点是普通按钮，切换只读内容（不采用 ARIA tab 语义）。
  - role: group
    name: "内容页签"
    required: false

  - role: button
    name: "概览 / 核销 / 生成 / 系统"
    required: false
    testid: "dot-tab-0..3"
    action: click
    effect: "切换只读内容"

  # RedemptionCard 的 show_edit 为 false；共享卡没有底部操作行。
  - role: region
    name: "无底部操作行"
    required: true
    testid: "redemption-card-new"
    bottom_action_row: false
