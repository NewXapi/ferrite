page: "#currency"
name: "货币管理"

# 契约源：crates/web/admin-page-admin/src/currency.rs 的 CurrencyPage。
# 导航入口：管理区「货币」tab（Section::Manage index 9）或 #currency hash
# （apps/admin-web/src/lib.rs 的 get_initial_route）。testid 与源码逐字对账，
# 改动 currency.rs 时必须同步本文件——CI 由
# crates/web/admin-page-admin/tests/route_currency_wire.rs 钉死可达性。

elements:
  # ---------- 根容器 ----------
  - role: region
    name: "货币管理"
    required: true
    testid: "currency-page"

  # ---------- 错误 / 成功提示（条件渲染） ----------
  - role: button
    name: "重试"
    testid: "currency-retry"
    required: false
    action: click
    expect_reload: true

  - role: alert
    name: "操作错误"
    testid: "currency-action-error"
    required: false

  - role: status
    name: "操作成功"
    testid: "currency-action-ok"
    required: false

  # ---------- 列表 ----------
  - role: region
    name: "货币定义列表"
    required: true
    testid: "currency-list-section"

  - role: table
    name: "货币定义列表"
    testid: "currency-list"
    required: false
    min_rows: 1

  # 行内按钮：testid 随货币 code 拼接（currency-edit-<code> / currency-disable-<code>）。
  # 停用按钮仅在货币 enabled 时渲染（余额非零的货币不可物理删除，仅可停用）。
  - role: button
    name: "编辑"
    testid: "currency-edit-<code>"
    required: false
    action: click
    expect_form_prefill: "currency-form-section"

  - role: button
    name: "停用"
    testid: "currency-disable-<code>"
    required: false
    action: click

  # ---------- 表单 ----------
  - role: region
    name: "货币表单"
    required: true
    testid: "currency-form-section"

  - role: textbox
    name: "Code"
    testid: "currency-code-input"
    required: true
    # 编辑既有货币时禁用（code 是不可变主键）
    disabled_when_editing: true

  - role: textbox
    name: "名称"
    testid: "currency-name-input"
    required: true

  - role: textbox
    name: "符号"
    testid: "currency-symbol-input"
    required: true

  - role: combobox
    name: "kind"
    testid: "currency-kind-select"
    required: true
    options: ["points", "fiat"]

  - role: textbox
    name: "汇率"
    testid: "currency-rate-input"
    required: true
    # USD 是基准货币，汇率恒为 1 且禁用编辑；其余货币可改
    # （修改汇率实时影响全体用户可用额度，历史交易不锁汇率）
    disabled_for_base_currency: "USD"

  - role: textbox
    name: "小数位"
    testid: "currency-precision-input"
    required: true

  - role: checkbox
    name: "启用"
    testid: "currency-enabled-check"
    required: true

  - role: textbox
    name: "备注"
    testid: "currency-remark-input"
    required: true

  - role: button
    name: "创建货币"
    testid: "currency-submit"
    required: true
    action: click
    # 编辑态文案变「保存修改」
    label_when_editing: "保存修改"

  - role: button
    name: "取消（转新增）"
    testid: "currency-cancel"
    required: false
    action: click
    visible_only_when_editing: true
