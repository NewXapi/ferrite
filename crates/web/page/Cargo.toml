# newapi-page — pages crate

[package]
name = "newapi-page"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[features]
default = ["web"]
web = ["dioxus/web"]


[dependencies]
dioxus = { workspace = true }
gloo-timers = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "Performance"] }
wasm-bindgen = "0.2"
