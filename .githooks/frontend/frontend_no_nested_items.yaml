# FR-05 禁止函数体内定义类型
# function 内部禁止 struct / enum
# 理由: 阻挡 IDE 跳转, 阻挡复用, 阻挡命名空间清晰

ignore_paths:
  - ".wt/"
  - "target/"

forbidden_patterns:
  - path_regex: '^crates/.*\.rs$'
    pattern: '^[[:space:]]+(struct|enum)[[:space:]]+[A-Z]\w*'
    reason: "struct / enum 不应定义在 function 内"
    suggestion: "提到 mod 顶部 (同文件模块作用域) 或文件顶部"
    severity: FAIL