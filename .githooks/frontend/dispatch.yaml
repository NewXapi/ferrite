# dispatch.yaml — frontend 规范的钩子调度
# 接入: gate 二进制读取本文件, 按 hook 挂载 frontend 检查

pre-commit:
  - frontend/structure             # FR-01
  - frontend/shared_components     # FR-02
  - frontend/copy_constants        # FR-03
  - frontend/no_nested_items       # FR-05

pre-push:
  - frontend/structure
  - frontend/shared_components
  - frontend/copy_constants
  - frontend/no_nested_items
  - frontend/tests                 # FR-04

merge:
  - frontend/structure
  - frontend/shared_components
  - frontend/copy_constants
  - frontend/no_nested_items
  - frontend/tests