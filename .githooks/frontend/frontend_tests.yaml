# FR-04 测试代码划分
# 单元测试: 源文件内 #[cfg(test)] mod tests (私有函数)
# 集成测试: crates/<name>/tests/<topic>.rs (公共入口: api.rs / state.rs)
# Dioxus Signal 需要 runtime -> 集成测试用 headless VirtualDom 包裹 (见 with_runtime)

ignore_paths:
  - ".wt/"
  - "target/"

forbidden_patterns:
  - path_regex: '^crates/.*/src/.*_test\.rs$'
    reason: "src/ 内独立测试文件违反 Rust 惯例"
    suggestion: "合并到源文件 #[cfg(test)] mod 或移到 tests/"
    severity: WARN

expected_locations:
  - file_pattern: '^api_shapes\.rs$'
    expected_dir: "crates/page/*/tests/"

required_coverage:
  - "crates/page/admin/src/network.rs: 物理几何函数 (bezier/cubic_at/ease_out_quint/fit_view/dodge_frac/initial_positions)"
  - "crates/page/*/tests/api_shapes.rs: api 薄壳数据形状不变量"
  - "mock crate 数据: id 唯一/时间戳非零/引用下标有效"