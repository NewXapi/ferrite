# FR-04 + FR-07 测试代码划分
# 单元测试: 源文件内 #[cfg(test)] mod tests (私有函数)
# 集成测试: crates/<name>/tests/<topic>.rs (公共入口: api.rs / state.rs)

ignore_paths:
  - ".wt/"
  - "target/"

forbidden_patterns:
  # src/ 内独立测试文件违规
  - path_regex: '^crates/[^/]+/src/.*_test\.rs$'
    reason: "src/ 内 _test.rs 违反 Rust 惯例"
    suggestion: "合并到源文件 #[cfg(test)] mod 或移到 tests/ 目录"
    severity: WARN
  - path_regex: '^crates/[^/]+/src/test_[^/]+\.rs$'
    reason: "src/ 内 test_*.rs 违反 Rust 惯例"
    suggestion: "同上"
    severity: WARN

# 集成测试预期位置 (所有 page 必须有 tests/api_shapes.rs)
expected_locations:
  - file_pattern: '^api_shapes\.rs$'
    expected_dir: "crates/page-account/tests/"
  - file_pattern: '^api_shapes\.rs$'
    expected_dir: "crates/page-admin/tests/"
  - file_pattern: '^api_shapes\.rs$'
    expected_dir: "crates/page-auth/tests/"
  - file_pattern: '^api_shapes\.rs$'
    expected_dir: "crates/page-leaderboard/tests/"
  - file_pattern: '^api_shapes\.rs$'
    expected_dir: "crates/page-models/tests/"
  - file_pattern: '^api_shapes\.rs$'
    expected_dir: "crates/page-overview/tests/"
  - file_pattern: '^api_shapes\.rs$'
    expected_dir: "crates/page-users/tests/"