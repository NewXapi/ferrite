# FR-03 文案常量 (反硬编码)
# 同一中文字面量复用 2+ 次 -> 抽 const
#
# 位置:
#   单组件内复用 -> 组件函数顶部 const
#   跨组件复用 -> mod 顶部 const
#   跨 page 复用 -> crates/ui/src/locale.rs (尚未启用)

ignore_paths:
  - ".wt/"
  - "target/"
  - ".githooks/"
  - "crates/mock/"

forbidden_patterns:
  # rsx 内中文字面量 (api.rs / state.rs / mock 豁免)
  - path_regex: '^crates/page-[^/]+/src/(?!api\.rs$|state\.rs$)[^/]+\.rs$'
    pattern: '"[^"]*[\p{Han}][^"]*"'
    reason: "rsx 内硬编码中文; 复用 2+ 次应抽 const"
    suggestion: "按共享范围就近抽 const (组件内或 mod 级)"
    severity: FAIL
    exemption_markers:
      - "//!"
      - "///"
      - "#[cfg(test)]"
      - "//"

  # mock 数据硬编码中文 (这是数据, 留在 mock crate)
  - path_regex: '^crates/mock/[^/]+\.rs$'
    pattern: '"[^"]*[\p{Han}][^"]*"'
    reason: "mock 数据: 仅允许在 crates/mock/, 面板禁止直连"
    suggestion: "面板通过 api.rs 薄壳取数"
    severity: FAIL