# FR-06 常量分层 (扩展 FR-03)
# 所有"硬编码"按性质归类, 不混:
#   - 文案 (中文 / 英文 / 用户可见字符串) -> const, 见 FR-03
#   - 视觉 class 串 (Tailwind) -> 暂留 rsx, 不抽 (用户拍板)
#   - mock 数据 (人名 / 渠道名 / 数值) -> crates/mock/<域>.rs
#   - 业务枚举 (status / role / filter 值) -> const, 见 FR-03
#   - magic number (物理参数 / 阈值) -> 模块级 const
#   - DOM id / API endpoint / URL path -> 标识符, 不是文案, 不进 locale
# 触发: 接真后端 / 改主题色板 / 跨 page 共享 -> 升级到对应容器
# 当前规模不需要独立 constants crate; 一切就近

ignore_paths:
  - ".wt/"
  - "target/"
  - ".githooks/"

# 这是策略文档, 不带强制检测规则. 检测规则由各具体 FR 覆盖.
# 这里仅说明分层, 留作人类 checklist.

notes:
  layer_table: |
    | 性质         | 抽到哪                       | 检测规则                    |
    |--------------|------------------------------|----------------------------|
    | 文案 (中/英) | 组件顶部 const / 模块级 const | FR-03 chinese_literal      |
    | class 串     | 不抽, 留 rsx                 | (无)                       |
    | mock 数据    | crates/mock/<域>.rs          | FR-01 面板禁止直连 mock    |
    | 业务枚举     | 跟文案同级 (模块级 const)   | FR-03 同                   |
    | magic number | 模块级 const (该文件内)      | FR-05 (fn 内禁 const)      |
    | DOM id       | 模块级 const (跨 component)  | (无)                       |
    | endpoint/URL | lib.rs 集中 (api 客户端)     | (无)                       |

  size_threshold_for_globalization: |
    1. 跨 page 复用 -> 提升到 crates/ui/src/<scope>.rs
    2. theme 切换 (zinc -> slate) 出现 -> 提升到 crates/ui/src/class.rs
    3. i18n 多语言出现 -> 提升到 crates/ui/src/locale/<lang>.rs (或 fluent)

  anti_patterns:
    - "常量都放到 crates/constants/"   # 注释: 这是过早抽象
    - "i18n 库提前引入"               # 注释: 单语言 const 够用
    - "class 抽出来反复 use"          # 注释: 维护成本大于复用收益
    - "用抽常量替代改文案"            # 注释: 工作量没省