[package]
name = "admin-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["web"]
web = ["dioxus/web"]

[[bin]]
name = "admin-web"
path = "src/main.rs"

[lib]
name = "admin_web"
path = "src/lib.rs"

[dependencies]
dioxus           = { workspace = true }
client           = { path = "../../crates/web/admin-client" }
ui               = { package = "ui-components", path = "../../crates/web/ui-components" }
page-auth        = { package = "admin-page-auth", path = "../../crates/web/admin-page-auth" }
page-account     = { package = "admin-page-account", path = "../../crates/web/admin-page-account" }
page-overview    = { package = "admin-page-overview", path = "../../crates/web/admin-page-overview" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Location"] }
page-admin       = { package = "admin-page-admin", path = "../../crates/web/admin-page-admin" }
page-users       = { package = "admin-page-users", path = "../../crates/web/admin-page-users" }
