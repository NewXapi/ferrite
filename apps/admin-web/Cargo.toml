[package]
name = "admin-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["web"]
web = ["dioxus/web"]

[[bin]]
name = "admin-web"
path = "src/main.rs"

[lib]
name = "admin_web"
path = "src/lib.rs"

[dependencies]
dioxus           = { workspace = true }
client           = { path = "../../crates/admin-web/client" }
ui               = { path = "../../crates/admin-web/ui" }
page-auth        = { path = "../../crates/admin-web/page-auth" }
page-account     = { path = "../../crates/admin-web/page-account" }
page-overview    = { path = "../../crates/admin-web/page-overview" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Location"] }
page-admin       = { path = "../../crates/admin-web/page-admin" }
page-users       = { path = "../../crates/admin-web/page-users" }
