[package]
name = "admin-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["web"]
web = ["dioxus/web"]
# dev 专用免登录调试（默认关, 生产构建不带）：无 token 且不在登录页时自动以
# dev 种子账号 admin_dev（同 db/dev/generate_seed.py）登录。开启方式：
# `dx serve --features debug-auto-login` 或 `just dev-web <port> debug`。
debug-auto-login = []

[[bin]]
name = "admin-web"
path = "src/main.rs"

[lib]
name = "admin_web"
path = "src/lib.rs"

[dependencies]
dioxus           = { workspace = true }
client           = { path = "../../crates/web/admin-client" }
serde            = { workspace = true }
serde_json       = { workspace = true }
ui               = { package = "ui-components", path = "../../crates/web/ui-components" }
page-auth        = { package = "admin-page-auth", path = "../../crates/web/admin-page-auth" }
page-account     = { package = "admin-page-account", path = "../../crates/web/admin-page-account" }
page-overview    = { package = "admin-page-overview", path = "../../crates/web/admin-page-overview" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Location", "console"] }
page-admin       = { package = "admin-page-admin", path = "../../crates/web/admin-page-admin" }
page-users       = { package = "admin-page-users", path = "../../crates/web/admin-page-users" }
