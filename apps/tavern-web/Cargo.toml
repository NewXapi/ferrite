[package]
name = "tavern-web-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["web"]
web = ["dioxus/web"]

[[bin]]
name = "tavern-web-app"
path = "src/main.rs"

[lib]
name = "tavern_web_app"
path = "src/lib.rs"

[dependencies]
dioxus                = { workspace = true }
tavern-client         = { path = "../../crates/web/tavern-client" }
tavern-state          = { path = "../../crates/web/tavern-state" }
tavern-page-characters = { path = "../../crates/web/tavern-page-characters" }
tavern-page-chat      = { path = "../../crates/web/tavern-page-chat" }
tavern-page-settings  = { path = "../../crates/web/tavern-page-settings" }
tavern-page-home      = { path = "../../crates/web/tavern-page-home" }
tavern-page-personas  = { path = "../../crates/web/tavern-page-personas" }
tavern-page-lorebook  = { path = "../../crates/web/tavern-page-lorebook" }
ui-components        = { path = "../../crates/web/ui-components" }
