[package]
name = "newapi-web-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["web"]
web = ["dioxus/web"]

[[bin]]
name = "newapi-web-rs"
path = "src/main.rs"

[lib]
name = "newapi_web_rs"
path = "src/lib.rs"

[dependencies]
dioxus           = { workspace = true }
client           = { path = "../../crates/shared/client" }
ui               = { path = "../../crates/ui" }
page-auth        = { path = "../../crates/page/auth" }
page-account      = { path = "../../crates/page/account" }
page-overview    = { path = "../../crates/page/overview" }
page-models      = { path = "../../crates/page/models" }
page-leaderboard = { path = "../../crates/page/leaderboard" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Location"] }
page-admin       = { path = "../../crates/page/admin" }
page-users       = { path = "../../crates/page/users" }
