[package]
name = "leptos-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# 试用应用：SSR 首屏 + hydration。客户端编 wasm32，交互在浏览器里跑。
# 目的是量 leptos + axum 的 dev 期 CPU / 内存，与 dx serve 做对比。

[lib]
name = "leptos_web"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "leptos-web"
path = "src/main.rs"
required-features = ["ssr"]

[features]
default = ["ssr"]
ssr = [
    "leptos/ssr",
    "leptos_router/ssr",
    "singlestage/ssr",
    "dep:leptos_axum",
    "dep:axum",
    "dep:tokio",
]
csr = [
    "leptos/csr",
    "leptos/hydrate",
    "singlestage/csr",
    "singlestage/hydrate",
    "dep:wasm-bindgen",
    "dep:console_error_panic_hook",
    "dep:server_fn",
]
[dependencies]
leptos        = { version = "=0.8.20" }
leptos_router = { version = "=0.8.15" }
leptos_axum   = { version = "=0.8.10", optional = true }
serde         = { workspace = true }
anyhow        = { workspace = true }
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen  = { version = "=0.2.128", optional = true }
server_fn     = { version = "=0.8.13", optional = true }
singlestage   = { version = "0.4", default-features = false, features = [
    "button", "card", "badge", "input", "dialog", "dropdown", "select",
    "tabs", "table", "separator", "label", "skeleton", "pagination", "popover",
] }
axum   = { workspace = true, optional = true }
tokio  = { workspace = true, optional = true, features = ["net", "rt-multi-thread", "macros"] }

[package.metadata.leptos]
output-name = "leptos-web"
site-root = "/home/hathaway/projects/ferrite/.wt/leptos-web/target/site"
site-pkg-dir = "pkg"
lib-crate = "leptos_web"
lib-features = ["csr"]
bin-features = ["ssr"]
site-addr = "127.0.0.1:8081"
reload-port = 8091
env = "DEV"
