name: Release (docker images to GHCR)

# 版本以 git tag 为载体，组件前缀 api-v<major>.<minor>.<patch>（口径见
# .agent/tasks/versioning.md 与仓库 VERSIONING.md）：
#   major = 用户确认的 breaking（当前 0）
#   minor = api 组件用户可感知功能域数
#   patch = `-- apps/api crates/gateway` 的 fix 提交数（见 VERSIONING.md 复现命令）
# 切 tag 前重跑 patch pathspec 命令确认版本号；tag 名即镜像 tag。
#
# 触发：推 api-v* tag。
# 产物（全部推 ghcr.io/newxapi/）：
#   ferrite-api:<version>  + ferrite-api:latest      全功能（default = tavern + billing）
#   ferrite-api:<version>  + ferrite-api:personal    个人形态（--no-default-features）
#   ferrite-admin-web:<version>  + :latest
#   ferrite-tavern-web:<version> + :latest
# compose 用 :latest / :personal 滚动标签，用 <version> 锁定发布版。

on:
  push:
    tags:
      - "api-v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      owner: ${{ steps.own.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#api-}" >> "$GITHUB_OUTPUT"
      - name: Lowercase owner (GHCR requires lowercase)
        id: own
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  api:
    name: api (${{ matrix.tag }})
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          # 两形态共用包 ferrite-api，用 tag 区分（compose.personal.yml 引用 :personal）。
          - features: ""
            tag: "latest"
          - features: "--no-default-features"
            tag: "personal"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api/Dockerfile
          build-args: |
            FEATURES=${{ matrix.features }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.meta.outputs.owner }}/ferrite-api:${{ needs.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ needs.meta.outputs.owner }}/ferrite-api:${{ matrix.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web:
    name: ${{ matrix.app }}
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        app: [admin-web, tavern-web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.meta.outputs.owner }}/ferrite-${{ matrix.app }}:${{ needs.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ needs.meta.outputs.owner }}/ferrite-${{ matrix.app }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
