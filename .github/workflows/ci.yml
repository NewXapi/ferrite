name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 手动触发：PR 事件偶发不投递（synchronize/reopened 丢失）时，可从 Actions 页面
  # 或 `gh workflow run ci.yml --ref <branch>` 强制跑一遍，不用等 GitHub 恢复。
  workflow_dispatch:
    inputs:
      base:
        description: '受影响 crate diff 的基线 ref（web 车道分支默认 web-dev 即可；其他域分支显式传 main）'
        default: 'web-dev'
        required: false
      deploy_images:
        description: '是否构建部署镜像验证（重构/快速验证传 false 跳过；发布 PR 仍需为 true）'
        default: 'true'
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：全部 job 只需读 checkout（构建/测试不写仓库，评论由本地 gate 工具发）
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run rustfmt
        run: cargo fmt --all --check

  clippy:
    name: Clippy Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  # PR：按 git diff 的 path scope 只跑受影响的包，快速反馈。
  # workflow_dispatch 走同一路径：base 取 inputs.base（pull_request 时用 github.base_ref）。
  dynamic-test:
    name: Dynamic Crate Check & Test
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Run Affected Crates Tests
        run: bash scripts/ci-affected.sh --base "origin/${{ github.base_ref || inputs.base }}"

  # 合并到 main：跑全量，作为动态选包的兜底。

  full-test:
    name: Full Workspace Test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Build all targets
        run: cargo build --all-targets

      - name: Test all
        run: cargo test --all

  # gateway-proxy 的 feature 门编译验证：
  # - utls：uTLS 走 meow-config/boring-tls，需要 BoringSSL（系统 cmake 编译），
  #   平时 CI 不覆盖，改到 TLS 接线时靠这个 job 兜底。
  # - no-default-features：协议 feature 全关的极端配置，验证 feature 门没漏。
  proxy-feature-matrix:
    name: Proxy Feature Matrix (utls / minimal)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cmake + mold (BoringSSL + fast linker)
        run: sudo apt-get update && sudo apt-get install -y cmake mold
      - name: Check with utls feature
        run: cargo check -p gateway-proxy --features utls
      - name: Check with no default features
        run: cargo check -p gateway-proxy --no-default-features

  # apps/api 双入口 feature 门的编译验证（todo/features-dual-entry-roadmap 任务 3）。
  # 动机：tests/e2e 以默认 feature 依赖 apps/api，上面 clippy job 的 --all-targets
  # 也只编默认变体 → 个人形态（关掉 tavern/billing）平时没人编，是持续验证盲区。
  # 三个非默认组合各 check 一遍；默认（全功能）变体由 clippy / full-test 覆盖，不重复。
  # 只 check 不 clippy：-D warnings 在非默认变体可能冒出新的 lint 噪音，治理它们是
  # 后续任务，本 job 先守住"每个组合都能编"这个最低契约（见对应 commit body）。
  api-feature-matrix:
    name: API Feature Matrix (${{ matrix.variant.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant:
          # 个人形态：关掉 tavern + billing
          - name: personal
            flags: "--no-default-features"
          - name: tavern-only
            flags: "--no-default-features --features tavern"
          - name: billing-only
            flags: "--no-default-features --features billing"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 仓库 .cargo/config.toml 对 x86_64-unknown-linux-gnu 配了
      # `linker = "clang"` + `-C link-arg=--ld-path=/usr/bin/mold`，
      # runner 上没预装 mold，不装则 clang 在 build script 链接期就失败：
      #   clang: error: invalid linker name in argument '--ld-path=/usr/bin/mold'
      # dynamic-test / clippy 等 job 都已装，本 job 漏了。
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold
      - name: Check ${{ matrix.variant.name }} variant
        run: cargo check -p api ${{ matrix.variant.flags }}

  # 部署镜像构建验证：deploy/ 的 Dockerfile 只在切 tag 时由 release.yml 真正
  # 构建推送，PR 期必须先验过，否则 Dockerfile 错误要等到切 tag 才暴露。
  # 只构建不推送（本 job 无 packages:write 权限）。这是 ci.yml 里最慢的 job
  # （全 workspace 编译 + cargo install dioxus-cli），接受。
  deploy-images:
    if: ${{ inputs.deploy_images != 'false' }}
    name: Deploy Images (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image: [api, admin-web, tavern-web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.image }}/Dockerfile
          push: false
          cache-from: type=gha
          tags: ferrite-${{ matrix.image }}:ci
