name: Debug Server Connection

on:
  push:
    branches:
      - feat/gateway-bench
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass openssh-client

      - name: Test Direct SSH Connection with Password
        env:
          HOST: ${{ secrets.BENCH_SERVER_HOST }}
          USER: ${{ secrets.BENCH_SERVER_USER }}
          PASS: ${{ secrets.BENCH_SERVER_PASSWORD }}
        run: |
          echo "=== 1. Checking Secret Variables Presence ==="
          [ -z "$HOST" ] && echo "HOST is EMPTY" || echo "HOST is provided (len: ${#HOST})"
          [ -z "$USER" ] && echo "USER is EMPTY" || echo "USER is provided: $USER"
          [ -z "$PASS" ] && echo "PASS is EMPTY" || echo "PASS is provided (len: ${#PASS})"

          echo ""
          echo "=== 2. Testing Network Port 22 Reachability ==="
          nc -zv -w 5 "$HOST" 22 || echo "Port 22 connect failed"

          echo ""
          echo "=== 3. Testing SSH Login with Password (Verbose -vvv) ==="
          # 用 sshpass 尝试最简单的 whoami 命令，带详细调试输出
          sshpass -p "$PASS" ssh -vvv \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o PreferredAuthentications=password,keyboard-interactive \
            -o ConnectTimeout=10 \
            "$USER@$HOST" "echo 'SUCCESS: logged in as \$(whoami)'; uname -a" || {
              EXIT_CODE=$?
              echo ""
              echo "=== 4. Failure Summary ==="
              echo "SSH command failed with exit code: $EXIT_CODE"
              if [ $EXIT_CODE -eq 5 ]; then
                echo "Explanation: Exit code 5 from sshpass means the server explicitly rejected the password or PasswordAuthentication is disabled."
              fi
              exit $EXIT_CODE
            }
