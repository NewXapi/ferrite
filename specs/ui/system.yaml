page: "admin/#system"
name: "系统配置"

elements:
  - role: heading
    name: "系统概览"
    required: true
  - role: heading
    name: "出口代理节点"
    required: true
    testid: "heading-proxy-nodes"
  - role: textbox
    name: "节点 URL"
    testid: "proxy-node-url"
    min_count: 1
  - role: textbox
    name: "绑定渠道 (逗号分隔)"
    testid: "proxy-node-channels"
  - role: textbox
    name: "优先级"
    testid: "proxy-node-priority"
  - role: button
    name: "＋ 添加节点"
    testid: "btn-add-proxy-node"
    action: click
    expect:
      - role: textbox
        name: "节点 URL"
        testid: "proxy-node-url"
        min_count: 2
  - role: button
    name: "删除"
    testid: "btn-remove-proxy-node"
    action: click
  - role: heading
    name: "功能模块与开关"
    required: true
