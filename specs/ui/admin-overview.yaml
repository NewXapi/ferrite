# UI Spec: 管理总览页
# agent 用 tab.ariaSnapshot() + data-testid 逐项验证
# 参考 OMP skill `ui-validate` 了解完整流程

page: "/admin"
name: "管理总览"

elements:
  - role: heading
    name: "系统状态"
    required: true
    testid: "heading-system-status"

  - role: tab
    name: "用户管理"
    testid: "tab-users"
    on_select:
      - role: table
        name: "用户列表"
        min_rows: 1
        testid: "table-users"

  - role: tab
    name: "渠道管理"
    testid: "tab-channels"
    on_select:
      - role: button
        name: "新建渠道"
        testid: "btn-new-channel"
        action: click
        expect_navigate: "/admin/channels/new"

  - role: button
    name: "刷新"
    testid: "btn-refresh"
    action: click
    expect_state_change: true
