# UI Spec: 用户管理页
# agent 用 tab.ariaSnapshot() + data-testid 逐项验证
# 参考 OMP skill `ui-validate` 了解完整流程
#
# 数据来自真实后端:挂载后 use_effect 拉 GET /api/user/users,
# 渲染 AdminUserDto。下列元素为接线后的稳定契约。

page: "/admin"
name: "用户管理"

elements:
  - role: region
    name: "用户管理"
    required: true
    testid: "users-panel"

  - role: searchbox
    name: "搜索用户名或邮箱"
    testid: "users-search"
    required: true

  - role: button
    name: "刷新"
    testid: "refresh-users"
    action: click
    expect_state_change: true

  - role: button
    name: "✚ 新建用户"
    testid: "new-user"
    action: click
    expect_navigate: "/admin/users/new"

  - role: listitem
    name: "用户 <username>"
    testid: "user-card"
    min_rows: 1
    # 每个 user-card 内应含 编辑 / 充值 / 启用或禁用 三个动作
    children:
      - role: button
        name: "编辑"
      - role: button
        name: "充值"
      - role: button
        name: "启用"
        # 或 "禁用",取决于该用户当前 status
