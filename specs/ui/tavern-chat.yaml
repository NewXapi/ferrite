page: "/tavern/chat"
name: "酒馆聊天室"

elements:
  - role: navigation
    name: "剧本与会话侧栏"
    testid: "sidebar-characters"
    required: true
    children:
      - role: button
        name: "收起侧栏"
        testid: "btn-sidebar-toggle"
        action: click
        expect_state: "sidebar collapsed -> icon rail (w-16)"
      - role: button
        name: "剧本详情"
        testid: "btn-detail"
        action: click
        expect_navigate: "open 剧本详情 modal"
      - role: button
        name: "赞赏作品"
        testid: "btn-donate"
        action: click
        expect_navigate: "open 赞赏作品 modal"
      - role: button
        name: "新对话"
        testid: "btn-new-chat"
        action: click
        expect_state: "new chat session created & active"

  - role: listitem
    name: "会话"
    testid: "session-chat-4"
    required: false
    note: "收缩态以单字符号(如 chat-N -> N)呈现,展开态显示完整标题;激活项高亮"

  - role: button
    name: "展开剧本与会话侧栏"
    testid: "btn-sidebar-toggle-top"
    action: click
    expect_state: "toggle sidebar collapse"

  - role: button
    name: "时间线大纲"
    testid: "btn-timeline"
    action: click
    expect_navigate: "open 右侧时间线大纲 drawer"
